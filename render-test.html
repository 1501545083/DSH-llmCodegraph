function forceLayout(nodes, edges, W, H) {
  const N = nodes.length
  if (!N) return []
  const pos = new Array(N)
  for (let i = 0; i < N; i++) {
    const a = (i / N) * Math.PI * 2
    pos[i] = { x: W / 2 + Math.cos(a) * Math.min(W, H) * 0.32, y: H / 2 + Math.sin(a) * Math.min(W, H) * 0.32, vx: 0, vy: 0 }
  }
  const idx = new Map()
  nodes.forEach((n, i) => idx.set(n.id, i))
  const links = []
  for (const e of edges) {
    const a = idx.get(e[0]), b = idx.get(e[1])
    if (a !== undefined && b !== undefined) links.push([a, b])
  }
  const REP = 5200, SPRING = 0.055, REST = 130, GRAV = 0.008, DAMP = 0.82
  for (let it = 0; it < 170; it++) {
    for (let i = 0; i < N; i++) pos[i].vx *= DAMP, pos[i].vy *= DAMP
    for (let i = 0; i < N; i++) {
      for (let j = i + 1; j < N; j++) {
        const dx = pos[j].x - pos[i].x, dy = pos[j].y - pos[i].y
        const d2 = Math.max(1, dx * dx + dy * dy)
        const f = REP / d2
        const d = Math.sqrt(d2)
        const fx = (dx / d) * f, fy = (dy / d) * f
        pos[i].vx -= fx; pos[i].vy -= fy; pos[j].vx += fx; pos[j].vy += fy
      }
    }
    for (const [a, b] of links) {
      const dx = pos[b].x - pos[a].x, dy = pos[b].y - pos[a].y
      const d = Math.max(1, Math.sqrt(dx * dx + dy * dy))
      const f = (d - REST) * SPRING
      const fx = (dx / d) * f, fy = (dy / d) * f
      pos[a].vx += fx; pos[a].vy += fy; pos[b].vx -= fx; pos[b].vy -= fy
    }
    for (let i = 0; i < N; i++) {
      pos[i].vx -= (pos[i].x - W / 2) * GRAV
      pos[i].vy -= (pos[i].y - H / 2) * GRAV
      pos[i].x += pos[i].vx
      pos[i].y += pos[i].vy
    }
  }
  return pos
}

// ---- run the same layout + fit + render the same SVG structure ----

const laid = NODES.map((n, i) => Object.assign({}, n, { x: pos[i].x, y: pos[i].y }))

let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity
for (const n of laid) {
  minX = Math.min(minX, n.x - 60); maxX = Math.max(maxX, n.x + 60)
  minY = Math.min(minY, n.y - 20); maxY = Math.max(maxY, n.y + 20)
}
const w = Math.max(1, maxX - minX), h = Math.max(1, maxY - minY)
const k = Math.min(1, 780 / w, 480 / h)
const view = { x: 60 + (780 - w * k) / 2 - minX * k, y: 20 + (480 - h * k) / 2 - minY * k, k }

const svg = document.getElementById('svg')
let out = ''
out += '<g transform="translate(' + view.x + ',' + view.y + ') scale(' + view.k + ')">'
for (const e of EDGES) {
  const a = laid.find((n) => n.id === e[0])
  const b = laid.find((n) => n.id === e[1])
  if (!a || !b) continue
  out += '<line x1="' + a.x + '" y1="' + a.y + '" x2="' + b.x + '" y2="' + b.y + '" class="llmg-edge" stroke-width="1"/>'
}
out += '</g>'
out += '<g transform="translate(' + view.x + ',' + view.y + ') scale(' + view.k + ')">'
for (const n of laid) {
  const color = KIND_COLORS[n.kind] || '#8a94a6'
  out += '<g>'
  out += '<circle cx="' + n.x + '" cy="' + n.y + '" r="12" fill="' + color + '" stroke="rgba(0,0,0,0.25)" stroke-width="1"/>'
  out += '<text class="llmg-node-label" x="' + (n.x + 16) + '" y="' + (n.y + 4) + '">' + n.name + '</text>'
  out += '</g>'
}

svg.innerHTML = out
